<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2c3e50">
    <title>Anda Sedang Offline - To Do List Mahasiswa</title>
    <style>
        /* Sengaja ditulis inline agar halaman ini tidak bergantung pada file lain. */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background: #f4f4f9;
            color: #333;
        }
        .card {
            max-width: 440px;
            width: 100%;
            padding: 32px 24px;
            text-align: center;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, .1);
        }
        .icon { font-size: 3rem; margin-bottom: 8px; }
        h1 { font-size: 1.4rem; margin-bottom: 10px; color: #2c3e50; }
        p { margin-bottom: 20px; }
        button {
            min-height: 44px;
            padding: 10px 18px;
            border: none;
            border-radius: 4px;
            background: #1769aa;
            color: #fff;
            font: inherit;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #0f568c; }
        button:focus-visible { outline: 3px solid #005fcc; outline-offset: 2px; }
        @media (prefers-color-scheme: dark) {
            body { background: #1a1a1a; color: #ecf0f1; }
            .card { background: #2c3e50; }
            h1 { color: #ecf0f1; }
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="icon" aria-hidden="true">📡</div>
        <h1>Anda sedang offline</h1>
        <p>
            Halaman ini belum tersimpan di perangkat Anda dan tidak bisa dimuat tanpa internet.
            Halaman tugas yang pernah Anda buka sebelumnya tetap bisa dilihat saat offline.
        </p>
        <button type="button" id="retry">Coba lagi</button>
    </main>

    <script>
        document.getElementById("retry").addEventListener("click", function () {
            location.reload();
        });
        // Otomatis kembali ke aplikasi saat koneksi pulih.
        window.addEventListener("online", function () {
            location.reload();
        });
    </script>
</body>
</html>
