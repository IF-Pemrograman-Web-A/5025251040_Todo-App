<!DOCTYPE html>
<html>
    <head>
        <title> To Do List Mahasiswa Informatika </title>
        <link rel="stylesheet" href="style.css">
    </head>
  	
    <body>
        <header>
            <h1>To Do List Mahasiswa</h1>
            <button id="theme-toggle" class="btn-theme">Toggle Dark/Light Mode</button>
        </header>
        
        <main>
            <aside class="panel-kiri">
                <h3> Daftar Penugasan </h3>
                <!-- Data statis dihapus, akan digantikan menggunakan JavaScript -->
                <ul id="task-list"></ul> 

                <hr>

                <form>
                    <p>
                        <label for="nama-tugas"> Nama Tugas : </label>
                        <input type="text" id="nama-tugas" placeholder="Masukkan nama tugas">
                    </p>
                    <p>
                        <label for="tanggal"> Deadline : </label>
                        <input type="date" id="tanggal">
                    </p>
                    <p>
                        <label for="deskripsi"> Deskripsi : </label>
                        <input type="text" id="deskripsi" placeholder="Masukkan deskripsi tugas">
                    </p>
                    <button type="button" id="add-btn"> 
                        Tambah daftar tugas 
                    </button> 
                </form>

            </aside>

            <aside class="panel-kanan" id="panel-deskripsi">
                <h3> Deskripsi Tugas </h3>
                <p>Silakan klik tombol <b>Edit</b> pada daftar tugas di sebelah kiri untuk melihat dan mengubah deskripsi tugas di sini.</p>
            </aside>
        </main>
        
        <footer>
            <div id="semangatberkuliah"> Semangat Berkuliah! </div>
        </footer>
        
        <script src="script.js"></script>
    </body>
</html>
